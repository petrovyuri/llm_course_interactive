<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Настоящее обучение по эпохам</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
h1 { margin-bottom: 6px; }
button { padding: 4px 9px; font-size: 13px; }
.panel { padding: 8px 10px; margin-bottom: 6px; }
.top { display: grid; gap: 6px; }
.muted-label { color: var(--muted); font-size: 13px; }
#epoch { flex: 1 1 180px; }
#chart { width: 100%; height: auto; display: block; }
#chart text { font-size: 11px; font-family: inherit; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 14px; margin: 2px 0 0; font-size: 12.5px; }
.legend .train { color: var(--purple); }
.legend .test { color: var(--orange); }
.pred { width: 100%; border-collapse: separate; border-spacing: 3px 1px; font-size: 12px; }
.pred th { padding: 0 4px; font-weight: 400; color: var(--muted); text-align: left; }
.pred td { padding: 1px 4px; white-space: nowrap; }
.pred td.ctx { color: var(--muted); }
.pred td.want { color: var(--green); }
.pred td:last-child { white-space: normal; }
.pred .tok { display: inline-block; margin-right: 10px; white-space: nowrap; }
.pred .tok.hit { color: var(--green); }
.note { margin: 4px 0 0; font-size: 12px; }
@media (max-width: 520px) {
  .pred { font-size: 11px; }
  .pred td { white-space: normal; }
  .pred .tok { display: block; margin: 0; }
}
</style>
</head>
<body>
<p class="eyebrow">Модуль 13 · урок 13.9</p>
<h1>Настоящее обучение по эпохам</h1>
<noscript><div class="panel">Демо не запустилось. Откройте его в отдельной вкладке.</div></noscript>

<div class="panel top">
  <div class="row"><span class="row" id="runs" role="group" aria-label="learning rate"></span><div id="epoch"></div></div>
</div>
<div class="panel">
  <svg id="chart" viewBox="0 0 600 150" role="img" aria-label="Loss по эпохам: на тексте урока и на новом тексте"></svg>
  <div class="legend mono"><span class="train" id="leg-train"></span><span class="test" id="leg-test"></span></div>
</div>
<div class="panel">
  <table class="pred mono" id="pred"></table>
</div>
<p class="caption" id="caption" aria-live="polite"></p>
<p class="muted note" id="note"></p>

<script type="module">
import { EPOCHS, LESSON, NEW_TEXT, RUNS, captionText, lossAt, parseRun, predRows } from "./logic.js";
import { fixed } from "../../kit/format.js";
import { el, presets, ready, slider, svg } from "../../kit/ui.js";

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const state = { key: parseRun(params.get("run") ?? ""), epoch: 50 };
const W = 600, H = 150, PL = 30, PR = 10, PT = 8, PB = 22, LMAX = 15;
const sx = (e) => PL + (e / EPOCHS) * (W - PL - PR);
const sy = (L) => PT + (1 - Math.min(L, LMAX) / LMAX) * (H - PT - PB);

function line(points, color) {
  return svg("polyline", { points: points.map(([e, L]) => `${sx(e).toFixed(1)},${sy(L).toFixed(1)}`).join(" "),
    fill: "none", stroke: color, "stroke-width": 1.8, "stroke-linejoin": "round" });
}

function chart() {
  const r = RUNS.find((x) => x.key === state.key);
  const nodes = [svg("line", { x1: PL, x2: W - PR, y1: sy(0), y2: sy(0), stroke: "var(--line)" }),
    svg("line", { x1: PL, x2: PL, y1: PT, y2: sy(0), stroke: "var(--line)" })];
  for (const L of [0, 5, 10, 15]) {
    nodes.push(svg("line", { x1: PL, x2: W - PR, y1: sy(L), y2: sy(L), stroke: "var(--line)", "stroke-dasharray": "2 4" }));
    nodes.push(Object.assign(svg("text", { x: PL - 4, y: sy(L) + 4, "text-anchor": "end", fill: "var(--muted)" }), { textContent: String(L) }));
  }
  for (const e of [0, 25, 50, 75, 100]) {
    nodes.push(Object.assign(svg("text", { x: sx(e), y: H - 6, "text-anchor": "middle", fill: "var(--muted)" }), { textContent: String(e) }));
  }
  nodes.push(line(r.train.map((L, i) => [i + 1, L]), "var(--purple)"), line(r.test.map((L, e) => [e, L]), "var(--orange)"));
  const top = Math.max(...r.test);
  if (top > LMAX) {   // без zero_grad loss на новом тексте уходит далеко за ось - говорим об этом прямо
    nodes.push(Object.assign(svg("text", { x: W - PR, y: sy(LMAX) + 16, "text-anchor": "end", fill: "var(--orange)" }),
      { textContent: `loss на новом тексте выше ${LMAX}, максимум ${fixed(top, 1)}` }));
  }
  const { epoch } = state;
  nodes.push(svg("line", { x1: sx(epoch), x2: sx(epoch), y1: PT, y2: sy(0), stroke: "var(--yellow)", "stroke-width": 1 }));
  const at = lossAt(state.key, epoch);
  if (at.train !== null) nodes.push(svg("circle", { cx: sx(epoch), cy: sy(at.train), r: 4, fill: "var(--purple)", stroke: "var(--bg)" }));
  nodes.push(svg("circle", { cx: sx(epoch), cy: sy(at.test), r: 4, fill: "var(--orange)", stroke: "var(--bg)" }));
  $("chart").replaceChildren(...nodes);
  $("leg-train").textContent = `текст урока: ${at.train === null ? "-" : fixed(at.train, 4)}`;
  $("leg-test").textContent = `новый текст: ${fixed(at.test, 4)}`;
}

function predictions() {
  const rows = predRows(state.key, state.epoch);
  $("pred").replaceChildren(
    el("tr", {}, el("th", {}, "после"), el("th", {}, "ответ"), el("th", {}, "p ответа"), el("th", {}, "3 самых вероятных")),
    ...rows.map((row) => el("tr", {}, el("td", { class: "ctx" }, row.context), el("td", { class: "want" }, row.want),
      el("td", {}, row.right),
      el("td", {}, ...row.top.map((x) => el("span", { class: `tok${x.hit ? " hit" : ""}` }, `${x.label} ${x.p}`))))));
}

function render() {
  chart();
  predictions();
  $("caption").textContent = captionText(state.key, state.epoch);
}

presets($("runs"), RUNS.map((r) => ({ label: r.key === "nozero" ? r.label : `lr ${r.label}`, value: r.key })), (key) => { state.key = key; render(); })
  .setActive(RUNS.findIndex((r) => r.key === state.key));
slider($("epoch"), { label: "эпоха", min: 0, max: EPOCHS, step: 1, value: state.epoch, format: String,
  onInput: (e) => { state.epoch = e; render(); } });
$("note").textContent = `Прогон записан заранее (seed 42). У вас числа будут другими, веса и батчи случайные: ${LESSON}.`;
$("leg-test").title = `Новый текст, его нет в обучении: «${NEW_TEXT}»`;
render();
ready();
</script>
</body>
</html>
