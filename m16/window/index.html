<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Что видит модель в окне</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
h1 { margin-bottom: 6px; }
[hidden] { display: none !important; }
.panel { padding: 8px 10px; margin-bottom: 6px; }
.top { display: grid; gap: 4px; }
.muted-label { color: var(--muted); font-size: 13px; }
.sliders { display: flex; flex-wrap: wrap; align-items: end; gap: 6px 14px; }
.sliders > div { flex: 1 1 220px; }
.nums .chip { min-width: 30px; padding: 2px 6px; font-size: 12px; }
.strip { display: flex; flex-wrap: wrap; gap: 3px; font-size: 12px; line-height: 1.2; }
.tok { padding: 1px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); white-space: pre; color: var(--muted); opacity: .55; }
.tok.prompt { border-style: dashed; }
.tok.eos { color: var(--orange); }
.tok.in { opacity: 1; color: var(--ink); border-color: var(--cyan); background: rgba(34, 211, 238, .12); }
.tok.eos.in { color: var(--orange); }
button.tok { font: inherit; cursor: pointer; }
.tok.target { opacity: 1; outline: 2px solid var(--yellow); outline-offset: 1px; color: var(--yellow); }
.info { margin: 5px 0 0; font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.ctx-title { margin: 0 0 3px; font-size: 12.5px; color: var(--muted); }
.ctx { display: grid; grid-template-columns: max-content 1fr max-content; gap: 1px 8px; font-size: 11px; line-height: 1.25; align-items: center; }
.ctx .row { gap: 2px; }
.ctx > span, .ctx .t { line-height: 15px; }
.ctx .t { padding: 0 3px; border-radius: 3px; background: var(--panel-2); white-space: pre; }
.ctx .dup .t { color: var(--orange); }
.ctx .same { color: var(--orange); }
.note { margin: 4px 0 0; font-size: 12.5px; }
</style>
</head>
<body>
<p class="eyebrow">Модуль 16 · урок 16.5</p>
<h1>Что видит модель в окне</h1>
<noscript><div class="panel">Демо не запустилось. Откройте его в отдельной вкладке.</div></noscript>

<div class="panel top">
  <div class="sliders"><div id="w"></div><span class="row" id="presets"></span></div>
  <div class="row"><span class="muted-label">пример:</span><span class="row nums" id="ex"></span></div>
</div>
<div class="panel">
  <div class="strip mono" id="strip"></div>
  <p class="info mono" id="info"></p>
</div>
<div class="panel">
  <p class="ctx-title">Что модель видит перед первым токеном ответа на каждый из 12 вопросов:</p>
  <div class="ctx mono" id="ctx"></div>
</div>
<p class="caption" id="caption" aria-live="polite"></p>
<p class="muted note">Нажмите на токен ответа: жёлтым - что модель предсказывает, голубым - её окно, пунктиром - промпт.</p>

<script type="module">
import { EXAMPLES, MAX_W, PRESETS, QUESTIONS, captionText, contexts, infoLine, windowView } from "./logic.js";
import { el, presets, ready, slider } from "../../kit/ui.js";

const $ = (id) => document.getElementById(id);
const state = { w: 4, ei: 0, j: 0 };
const PRESET_LABEL = { 4: "4 (модуль 15)", 32: "32 (модуль 16)" };

function render() {
  const n = EXAMPLES[state.ei].n;
  $("strip").replaceChildren(...windowView(state.ei, state.w, state.j).map((t, i) => {
    const cls = `tok ${t.kind}${t.inWindow ? " in" : ""}${t.target ? " target" : ""}`;
    if (t.kind === "prompt") return el("span", { class: cls }, t.label);
    return el("button", { type: "button", class: cls, "aria-pressed": String(t.target), onclick: () => { state.j = i - n; render(); } }, t.label);
  }));
  $("info").textContent = infoLine(state.ei, state.w);
  $("ctx").replaceChildren(...contexts(state.w).flatMap((c, i) => {
    const dup = c.same !== i;
    return [el("span", { class: "muted" }, String(i + 1)),
      el("span", { class: `row${dup ? " dup" : ""}` }, ...(c.cut ? [el("span", { class: "muted" }, "…")] : []),
        ...c.labels.map((t) => el("span", { class: "t" }, t))),
      el("span", { class: "same" }, dup ? `= ${c.same + 1}` : "")];
  }));
  $("caption").textContent = captionText(state.ei, state.w, state.j);
  tp.setActive(PRESETS.indexOf(state.w));
}

const sw = slider($("w"), { label: "окно, токенов", min: 1, max: MAX_W, step: 1, value: state.w, format: String,
  onInput: (v) => { state.w = v; render(); } });
const tp = presets($("presets"), PRESETS.map((w) => ({ label: PRESET_LABEL[w], value: w })), (w) => {
  state.w = w;
  sw.set(w);
  render();
});
presets($("ex"), QUESTIONS.map((q, i) => ({ label: String(i + 1), value: i })), (i) => {
  state.ei = i;
  state.j = 0;
  render();
}).setActive(0);
$("ex").querySelectorAll("button").forEach((b, i) => b.setAttribute("title", QUESTIONS[i]));
render();
ready();
</script>
</body>
</html>
