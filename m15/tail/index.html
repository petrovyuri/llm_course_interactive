<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хвост и ядро на настоящей модели</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
h1 { margin-bottom: 6px; }
[hidden] { display: none !important; }
.panel { padding: 8px 10px; margin-bottom: 6px; }
.top { display: grid; gap: 6px; }
.muted-label { color: var(--muted); font-size: 13px; }
.sliders { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.sliders > div { flex: 1 1 180px; }
.bars { display: grid; grid-template-columns: repeat(2, max-content max-content minmax(40px, 1fr)); gap: 2px 8px; align-items: center; font-size: 12px; }
@media (max-width: 520px) { .bars { grid-template-columns: max-content max-content minmax(40px, 1fr); } }
.bars .n { text-align: right; }
.bars .off { opacity: .4; }
.bar { height: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--purple); }
.info { margin: 4px 0 0; font-size: 12.5px; line-height: 1.4; }
.info .keep { color: var(--green); }
#chart { width: 100%; height: auto; display: block; }
#chart text { font-size: 11px; font-family: inherit; fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 2px 14px; margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.legend .core { color: var(--cyan); }
.legend .k { color: var(--orange); }
.note { margin: 4px 0 0; font-size: 12.5px; }
</style>
</head>
<body>
<p class="eyebrow">Модуль 15 · урок 15.6</p>
<h1>Хвост и ядро на настоящей модели</h1>
<noscript><div class="panel">Демо не запустилось. Откройте его в отдельной вкладке.</div></noscript>

<div class="panel top">
  <div class="row"><span class="muted-label">окно:</span><span class="row" id="windows"></span></div>
  <div class="row"><span class="muted-label">фильтр:</span><span class="row" id="modes"></span></div>
  <div class="sliders"><div id="t"></div><div id="k"></div><div id="p"></div></div>
</div>
<div class="panel">
  <div class="bars mono" id="bars"></div>
  <p class="info mono" id="info"></p>
</div>
<div class="panel">
  <svg id="chart" viewBox="0 0 600 80" role="img" aria-label="Размер ядра top-p в зависимости от температуры"></svg>
  <p class="legend mono"><span class="core" id="leg-core"></span><span class="k" id="leg-k"></span><span>«·» пробел, «↵» перенос строки</span></p>
</div>
<p class="caption" id="caption" aria-live="polite"></p>
<p class="muted note">Модель урока 14.2, обученная с seed 42, как в демо модуля 14; у модели урока 15.6 и у вашей числа другие.</p>

<script type="module">
import { KEYS, N, T10S, captionText, coreCurve, filtered, parseWindow, tailMass, topRows, windowText } from "./logic.js";
import { el, presets, ready, slider, svg } from "../../kit/ui.js";
import { fixed, pText } from "../../kit/format.js";

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const state = { key: parseWindow(params.get("window") ?? ""), mode: "topp", t10: 20, k: 5, p100: 90 };
const MODES = [["none", "без фильтра"], ["topk", "top-k"], ["topp", "top-p"]];
const group = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const W = 600, H = 80, PL = 42, PR = 10, PT = 5, PB = 17, LOGMAX = Math.log10(N);
const sx = (t10) => PL + ((t10 - 1) / 29) * (W - PL - PR);
const sy = (n) => PT + (1 - Math.log10(n) / LOGMAX) * (H - PT - PB);

function chart() {
  const { key, t10, k, p100, mode } = state;
  const pc = mode === "topp" ? p100 : 90;
  const curve = coreCurve(key, pc);
  const nodes = [svg("line", { x1: PL, x2: W - PR, y1: sy(1), y2: sy(1), stroke: "var(--line)" }),
    svg("line", { x1: PL, x2: PL, y1: PT, y2: sy(1), stroke: "var(--line)" })];
  for (const n of [1, 100, 10000]) {
    nodes.push(svg("line", { x1: PL, x2: W - PR, y1: sy(n), y2: sy(n), stroke: "var(--line)", "stroke-dasharray": "2 4" }));
    nodes.push(Object.assign(svg("text", { x: PL - 4, y: sy(n) + 4, "text-anchor": "end" }), { textContent: n >= 1000 ? `${n / 1000}k` : String(n) }));
  }
  for (const t of [1, 5, 10, 20, 30]) nodes.push(Object.assign(svg("text", { x: sx(t), y: H - 4, "text-anchor": "middle" }), { textContent: `T ${t / 10}` }));
  nodes.push(svg("line", { x1: PL, x2: W - PR, y1: sy(k), y2: sy(k), stroke: "var(--orange)", "stroke-width": 1.5, "stroke-dasharray": "6 4" }));
  nodes.push(svg("polyline", { points: curve.map(([t, n]) => `${sx(t).toFixed(1)},${sy(n).toFixed(1)}`).join(" "), fill: "none", stroke: "var(--cyan)", "stroke-width": 2 }));
  const cur = curve[t10 - 1][1];
  nodes.push(svg("line", { x1: sx(t10), x2: sx(t10), y1: PT, y2: sy(1), stroke: "var(--yellow)" }));
  nodes.push(svg("circle", { cx: sx(t10), cy: sy(cur), r: 4, fill: "var(--yellow)", stroke: "var(--bg)" }));
  $("chart").replaceChildren(...nodes);
  $("leg-core").textContent = `── ядро top-p при p = ${pc / 100}: ${group(cur)} при T = ${t10 / 10}`;
  $("leg-k").textContent = `- - top-k = ${k}`;
}

function render() {
  const { key, t10, mode, k, p100 } = state;
  const f = filtered(key, t10, mode, k, p100);
  const rows = topRows(key, t10);
  const maxP = Math.max(...rows.map((r) => (r.p.startsWith("<") ? 0 : Number(r.p))));
  $("bars").replaceChildren(...rows.flatMap((r, j) => {
    const off = j >= f.count ? " off" : "";
    const w = r.p.startsWith("<") ? 0 : (100 * Number(r.p)) / Math.max(maxP, 1e-9);
    return [el("span", { class: `${off}` }, r.label), el("span", { class: `n${off}` }, r.p),
      el("span", { class: `bar${off}` }, el("span", { style: `width: ${w.toFixed(1)}%` }))];
  }));
  const kept = mode === "none" ? `в рулетке все ${group(N)} токенов`
    : `в рулетке ${group(f.count)} из ${group(N)} токенов, их масса ${fixed(f.mass, 3)}`;
  const tw = pText(tailMass(key, t10));
  $("info").replaceChildren(el("span", {}, `хвост: остальные ${group(N - 10)} токенов весят ${tw.startsWith("<") ? "меньше 0.0001" : tw}`),
    " · ", el("span", { class: "keep" }, kept));
  chart();
  $("caption").textContent = captionText(key, t10, mode, k, p100);
  $("k").hidden = mode !== "topk";
  $("p").hidden = mode !== "topp";
}

const wins = presets($("windows"), KEYS.map((key) => ({ label: `«${windowText(key)}»`, value: key })), (key) => { state.key = key; render(); });
const modes = presets($("modes"), MODES.map(([value, label]) => ({ label, value })), (mode) => { state.mode = mode; render(); });
slider($("t"), { label: "температура T", min: 1, max: 30, step: 1, value: state.t10, format: (v) => String(v / 10), onInput: (v) => { state.t10 = v; render(); } });
slider($("k"), { label: "k", min: 1, max: 50, step: 1, value: state.k, format: String, onInput: (v) => { state.k = v; render(); } });
slider($("p"), { label: "порог p", min: 5, max: 95, step: 5, value: state.p100, format: (v) => String(v / 100), onInput: (v) => { state.p100 = v; render(); } });
wins.setActive(KEYS.indexOf(state.key));
modes.setActive(2);
render();
ready();
</script>
</body>
</html>
