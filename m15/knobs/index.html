<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Температура, top-k и top-p</title>
<link rel="stylesheet" href="../../kit/kit.css">
<style>
h1 { margin-bottom: 6px; }
[hidden] { display: none !important; }
.panel { padding: 8px 10px; margin-bottom: 6px; }
.top { display: grid; gap: 6px; }
.muted-label { color: var(--muted); font-size: 13px; }
.sliders { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.sliders > div { flex: 1 1 180px; }
.tbl { display: grid; grid-template-columns: repeat(5, max-content) minmax(24px, 1fr); gap: 3px 10px; align-items: center; font-size: 12.5px; }
.tbl .h { color: var(--muted); font-size: 12px; }
.tbl .n { text-align: right; }
.tbl .off { opacity: .45; }
.tbl .lead { color: var(--green); }
.bar { position: relative; height: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
.bar .fill { display: block; height: 100%; background: var(--purple); border-radius: 3px 0 0 3px; }
.bar .mark { position: absolute; top: -3px; bottom: -3px; border-left: 2px solid var(--ink); }
.bar.lead .fill { background: var(--green); }
.legend { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
.sum { margin: 6px 0 0; font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.note { margin: 4px 0 0; font-size: 12.5px; }
@media (max-width: 420px) {
  .tbl { gap: 3px 6px; font-size: 11.5px; }
}
</style>
</head>
<body>
<p class="eyebrow">Модуль 15 · уроки 15.3, 15.4 и 15.5</p>
<h1>Температура, top-k и top-p</h1>
<noscript><div class="panel">Демо не запустилось. Откройте его в отдельной вкладке.</div></noscript>

<div class="panel top">
  <div class="row" id="stages"></div>
  <div class="row"><span class="muted-label">T как в уроке:</span><span class="row" id="tpresets"></span></div>
  <div class="sliders"><div id="t"></div><div id="k"></div><div id="p"></div></div>
</div>
<div class="panel">
  <div class="tbl mono" id="tbl"></div>
  <p class="sum mono" id="sum"></p>
  <p class="legend" id="legend"></p>
</div>
<p class="caption" id="caption" aria-live="polite"></p>
<p class="muted note">Учебный пример модуля 12: пять слов и логиты урока 12.18. Порядок, как в уроке 15.4: температура, потом фильтр, потом softmax.</p>

<script type="module">
import { DEFAULTS, STAGES, captionText, parseStage, rows, sumLine } from "./logic.js";
import { el, presets, ready, slider } from "../../kit/ui.js";

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const stage0 = parseStage(params.get("stage") ?? "");
const state = { stage: stage0, ...DEFAULTS[stage0] };
const LABELS = { temperature: "температура", topk: "top-k", topp: "top-p" };
const HEAD = {
  temperature: ["токен", "z", "z/T", "e^(z/T)", "p", ""],
  topk: ["токен", "z/T", "e^(z/T)", "p при T", "p", ""],
  topp: ["токен", "p при T", "накоплено", "в ядре", "p в ядре", ""],
};

function cells(stage, r, lead) {
  const off = r.kept ? "" : " off";
  const bar = el("span", { class: `bar${lead ? " lead" : ""}` }, el("span", { class: "fill", style: `width: ${(100 * r.w).toFixed(1)}%` }),
    el("span", { class: "mark", style: `left: ${(100 * r.ref).toFixed(1)}%` }));
  const word = el("span", { class: `${lead ? "lead" : ""}${off}` }, r.word);
  const n = (t) => el("span", { class: `n${off}` }, t);
  if (stage === "temperature") return [word, n(r.z), n(r.zt), n(r.e), n(r.p), bar];
  if (stage === "topk") return [word, n(r.zt), n(r.e), n(r.pT), n(r.p), bar];
  return [word, n(r.pT), n(r.cum), n(r.kept ? "да" : "нет"), n(r.p), bar];
}

function render() {
  const { stage, t10, k, p100 } = state;
  const rs = rows(stage, t10, k, p100);
  const best = Math.max(...rs.map((r) => r.w));
  $("tbl").replaceChildren(...HEAD[stage].map((h) => el("span", { class: "h" }, h)),
    ...rs.flatMap((r) => cells(stage, r, r.w === best)));
  $("sum").textContent = sumLine(stage, t10, k, p100);
  $("caption").textContent = captionText(stage, t10, k, p100);
  $("legend").textContent = stage === "temperature" ? "белая черта - p при T = 1, столбик - p при выбранной T"
    : "белая черта - p до фильтра, столбик - p после фильтра";
  tp.setActive([5, 10, 20].indexOf(t10));
  $("k").hidden = stage !== "topk";
  $("p").hidden = stage !== "topp";
}

const sT = slider($("t"), { label: "температура T", min: 1, max: 30, step: 1, value: state.t10, format: (v) => String(v / 10),
  onInput: (v) => { state.t10 = v; render(); } });
const sK = slider($("k"), { label: "k", min: 1, max: 5, step: 1, value: state.k, format: String,
  onInput: (v) => { state.k = v; render(); } });
const sP = slider($("p"), { label: "порог p", min: 5, max: 100, step: 5, value: state.p100, format: (v) => String(v / 100),
  onInput: (v) => { state.p100 = v; render(); } });
const tabs = presets($("stages"), STAGES.map((s) => ({ label: LABELS[s], value: s })), (s) => {
  Object.assign(state, { stage: s }, DEFAULTS[s]);
  sT.set(state.t10);
  sK.set(state.k);
  sP.set(state.p100);
  render();
});
const tp = presets($("tpresets"), [5, 10, 20].map((t) => ({ label: String(t / 10), value: t })), (t) => {
  state.t10 = t;
  sT.set(t);
  render();
});
tabs.setActive(STAGES.indexOf(state.stage));
render();
ready();
</script>
</body>
</html>
